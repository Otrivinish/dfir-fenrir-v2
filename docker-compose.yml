# ── Shared runtime hardening (CIS Docker §5) ────────────────────────────────
# Merged into every service: no privilege escalation, no Linux capabilities
# (a service adds back only what it proves it needs), rotated logs.
# Dropping ALL also removes NET_RAW — no ARP spoofing / sniffing on the bridges.
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

networks:
  # Edge tier: Caddy (published 80/443), frontend, backend. Fixed subnet so Caddy has a
  # pinned address — the ONLY peer the backend trusts X-Forwarded-For from
  # (FORWARDED_ALLOW_IPS). Chosen outside Docker's default pools and this host's routes.
  fenrir-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.203.10.0/24
  # Data tier: Postgres, Redis, backup, audit-monitor + backend. No internet egress,
  # and unreachable from Caddy/frontend (zero trust: no path from the edge to the DB).
  fenrir-data:
    driver: bridge
    internal: true
  fenrir-analysis:
    driver: bridge
    internal: true  # No internet access for analysis worker

# ── Secrets: files in ./secrets (dir 0700, files 0444) — see scripts/secrets.sh ──
# Mounted read-only at /run/secrets/<name>, and ONLY into the services that need
# each one. Nothing secret is passed as an environment variable.
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
  redis_acl:
    file: ./secrets/redis_acl
  secret_key:
    file: ./secrets/secret_key
  evidence_kek:
    file: ./secrets/evidence_kek
  audit_signing_key:
    file: ./secrets/audit_signing_key
  worker_token:
    file: ./secrets/worker_token
  duckdns_token:
    file: ./secrets/duckdns_token
  # Per-service Postgres roles (docker/postgres/10-fenrir-roles.sh). postgres_password
  # above is the bootstrap superuser's — local-socket only (pg_hba), never networked.
  pg_migrator_password:
    file: ./secrets/pg_migrator_password
  pg_app_password:
    file: ./secrets/pg_app_password
  pg_monitor_password:
    file: ./secrets/pg_monitor_password
  pg_backup_password:
    file: ./secrets/pg_backup_password
  # Internal PKI (scripts/internal-pki.sh): service-to-service TLS. CA key never mounted.
  tls_ca_crt:
    file: ./secrets/tls_ca.crt
  tls_postgres_crt:
    file: ./secrets/tls_postgres.crt
  tls_postgres_key:
    file: ./secrets/tls_postgres.key
  tls_redis_crt:
    file: ./secrets/tls_redis.crt
  tls_redis_key:
    file: ./secrets/tls_redis.key
  tls_backend_crt:
    file: ./secrets/tls_backend.crt
  tls_backend_key:
    file: ./secrets/tls_backend.key
  tls_worker_crt:
    file: ./secrets/tls_analysis-worker.crt
  tls_worker_key:
    file: ./secrets/tls_analysis-worker.key
  tls_caddy_crt:
    file: ./secrets/tls_caddy.crt
  tls_caddy_key:
    file: ./secrets/tls_caddy.key

volumes:
  postgres-data:
    driver: local
  evidence-data:
    driver: local
  redis-data:
    driver: local
  quarantine-data:
    driver: local
  backup-data:
    driver: local
  yara-rules-data:
    driver: local
  branding-data:
    driver: local
  reports-data:
    driver: local
  logs-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  # Backend /tmp: disk-backed scratch for upload spools (up to 2 GiB) and collector
  # builds — a RAM tmpfs of that size would count against the backend's memory limit.
  backend-scratch:
    driver: local

services:
  # ── Caddy: TLS termination & reverse proxy ──────────────────────────────
  caddy:
    <<: *hardened
    build:
      context: ./docker/caddy
      dockerfile: Dockerfile
    container_name: fenrir-v2-caddy
    restart: unless-stopped
    user: "10001:10001"          # non-root, no capabilities (see docker/caddy/Dockerfile)
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    mem_limit: 256m
    pids_limit: 128
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config     # TLS files live in /config/tls (scripts/caddy-volume-prep.sh)
    secrets:
      - duckdns_token            # read only in TLS_MODE=duckdns
      - tls_ca_crt               # verify the backend's certificate
      - tls_caddy_crt            # client certificate for backend mTLS
      - tls_caddy_key
    networks:
      fenrir-internal:
        ipv4_address: 10.203.10.10   # pinned: backend trusts X-Forwarded-For from this address only
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "443"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Least privilege: Caddy is the internet-facing container, so it receives ONLY
    # its TLS settings — never the app secrets in .env (no env_file here).
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - TLS_MODE=${TLS_MODE:-auto}   # selfsigned|byo|acme|duckdns|internal|auto — see docker/caddy/entrypoint.sh
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-}
      - TLS_CERT_FILE=${TLS_CERT_FILE:-}
      - TLS_KEY_FILE=${TLS_KEY_FILE:-}

  # ── Frontend: React SPA served by hardened nginx (static) ────────────────
  # Caddy reverse-proxies to this on :3000. nginx (unprivileged, non-root)
  # serves the Vite-built dist with SPA fallback; it sets NO security headers
  # (the edge Caddy owns those). read_only rootfs + tmpfs for nginx temp/pid.
  frontend:
    <<: *hardened
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fenrir-v2-frontend
    restart: unless-stopped
    networks:
      - fenrir-internal
    expose:
      - "3000"
    read_only: true
    mem_limit: 64m
    pids_limit: 64
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
      - /var/cache/nginx:nosuid,size=16m
      - /var/run:nosuid,size=1m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Backend: FastAPI ─────────────────────────────────────────────────────
  backend:
    <<: *hardened
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dfir-fenrir-v2-backend:local   # also run by audit-monitor — one build, no drift
    container_name: fenrir-v2-backend
    restart: unless-stopped
    # Measured 2026-09-30: a max-size (1 GiB) evidence collect→seal→export cycle peaks at
    # ~4 GiB anonymous memory (whole-file AES-GCM + export ZIP in RAM). 6g = headroom so
    # that workflow can never OOM-kill the single uvicorn worker.
    # memswap_limit == mem_limit: decrypted evidence never pages to (unencrypted) host swap.
    mem_limit: 6g
    memswap_limit: 6g
    pids_limit: 256
    # Immutable code: the only writable paths are the data volumes, the scratch
    # volume at /tmp, and a tiny private tmpfs for the first-run bootstrap token.
    read_only: true
    tmpfs:
      - /app/data:uid=1001,gid=1001,mode=0700,size=1m,noexec,nosuid
    # Credentials come from /run/secrets (pydantic-settings secrets_dir): the DB URL is
    # built from PG* + postgres_password; Redis authenticates as ACL user `fenrir`.
    secrets:
      - source: pg_app_password      # DML-only role; read as settings.postgres_password
        target: postgres_password
      - tls_ca_crt
      - tls_backend_crt              # server cert (Caddy mTLS) + client cert (Redis mTLS)
      - tls_backend_key
      - redis_password
      - secret_key
      - evidence_kek
      - audit_signing_key
      - worker_token
    environment:
      - REDIS_URL=rediss://fenrir@redis:6379     # TLS 1.3 + client cert (mTLS) + ACL user
      - WORKER_URL=https://analysis-worker:8001   # TLS, verified against the internal CA
      - WORKER_TLS_CA=/run/secrets/tls_ca_crt
      - HOME=/tmp                 # the rootfs (incl. /home/fenrir) is read-only
      - REDIS_TLS_CA=/run/secrets/tls_ca_crt
      - REDIS_TLS_CERT=/run/secrets/tls_backend_crt
      - REDIS_TLS_KEY=/run/secrets/tls_backend_key
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=480
      - QUARANTINE_PATH=/quarantine
      - EVIDENCE_PATH=/evidence
      - BACKUP_PATH=/backups
      - SCRIPTS_PATH=/app/scripts
      - YARA_RULES_PATH=/yara-rules
      - BRANDING_PATH=/branding
      - REPORTS_PATH=/generated_reports
      - LOGS_PATH=/asset_logs
      - PGHOST=postgres
      - PGUSER=fenrir_app
      - PGDATABASE=fenrir
      - DB_SSL_CA=/run/secrets/tls_ca_crt   # TLS 1.3 to Postgres, verify-full
      - CORS_ORIGINS=${CORS_ORIGINS:-https://${DOMAIN:-localhost}}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-${DOMAIN:-localhost}}
      - TOTP_REQUIRED=${TOTP_REQUIRED:-true}
      - INACTIVITY_TIMEOUT_MINUTES=${INACTIVITY_TIMEOUT_MINUTES:-30}
      - EVIDENCE_PATH=/evidence
      # age PUBLIC key for manual DB dumps (same as the backup sidecar's).
      - BACKUP_AGE_RECIPIENT=${BACKUP_AGE_RECIPIENT:-}
      # U1 offline collectors — must match the Dockerfile ARG VELOCIRAPTOR_VERSION.
      - VELOCIRAPTOR_VERSION=${VELOCIRAPTOR_VERSION:-0.76.6}
      # uvicorn --proxy-headers trusts X-Forwarded-For ONLY from Caddy's pinned IP.
      - FORWARDED_ALLOW_IPS=10.203.10.10
    volumes:
      - quarantine-data:/quarantine
      - evidence-data:/evidence
      - backup-data:/backups
      - ./scripts:/app/scripts:ro
      - yara-rules-data:/yara-rules:ro
      - branding-data:/branding
      - reports-data:/generated_reports
      - logs-data:/asset_logs
      - backend-scratch:/tmp
    networks:
      - fenrir-internal
      - fenrir-data
      - fenrir-analysis
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # TLS with a REQUIRED client certificate from the internal CA (mutual TLS): only
    # Caddy (and this healthcheck, with the backend's own cert) can connect at all.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--proxy-headers",
              "--ssl-certfile", "/run/secrets/tls_backend_crt", "--ssl-keyfile", "/run/secrets/tls_backend_key",
              "--ssl-ca-certs", "/run/secrets/tls_ca_crt", "--ssl-cert-reqs", "2"]
    healthcheck:
      # /api/health skips rate limiting; the Host header must be an ALLOWED_HOSTS entry.
      test: ["CMD", "python", "-c", "import os,ssl,sys,urllib.request as u; c=ssl.create_default_context(cafile='/run/secrets/tls_ca_crt'); c.load_cert_chain('/run/secrets/tls_backend_crt','/run/secrets/tls_backend_key'); h=os.environ.get('ALLOWED_HOSTS','localhost').split(',')[0].strip(); sys.exit(0 if u.urlopen(u.Request('https://backend:8000/api/health', headers={'Host': h}), timeout=4, context=c).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── Migrate: one-shot schema migration ───────────────────────────────────
  # Runs create_all + the in-place migrations as fenrir_migrator → SET LOCAL ROLE
  # fenrir_owner, then exits; the backend starts only after it succeeds. DDL rights
  # therefore never live in the long-running, internet-facing backend.
  migrate:
    <<: *hardened
    image: dfir-fenrir-v2-backend:local
    pull_policy: never
    container_name: fenrir-v2-migrate
    restart: "no"
    command: ["python", "-m", "core.migrate"]
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    mem_limit: 512m
    pids_limit: 64
    secrets:
      - source: pg_migrator_password
        target: postgres_password
      - tls_ca_crt
    environment:
      - PGHOST=postgres
      - PGUSER=fenrir_migrator
      - PGDATABASE=fenrir
      - DB_OWNER_ROLE=fenrir_owner
      - DB_SSL_CA=/run/secrets/tls_ca_crt
    networks:
      - fenrir-data
    depends_on:
      postgres:
        condition: service_healthy

  # ── Analysis Worker: air-gapped malware analysis ─────────────────────────
  analysis-worker:
    <<: *hardened
    build:
      context: ./analysis-worker
      dockerfile: Dockerfile
    container_name: fenrir-v2-analysis
    restart: unless-stopped
    secrets:
      - worker_token                 # the backend must present it (Bearer) on every call
      - tls_ca_crt
      - tls_worker_crt
      - tls_worker_key
    # TLS (internal CA) — the backend verifies this certificate; PCAPs and results
    # never cross the network in plaintext.
    command: ["uvicorn", "worker:app", "--host", "0.0.0.0", "--port", "8001",
              "--ssl-certfile", "/run/secrets/tls_worker_crt", "--ssl-keyfile", "/run/secrets/tls_worker_key"]
    environment:
      - YARA_RULES_DIR=/yara-rules   # the only setting worker.py reads
      - HOME=/tmp                    # tools that look for ~/.config get the tmpfs
    volumes:
      - quarantine-data:/quarantine:ro   # read-only mount of hostile samples
      - yara-rules-data:/yara-rules:ro
    networks:
      - fenrir-analysis  # No internet access
    # Parses hostile files: immutable code, bounded memory/CPU/processes, no swap.
    read_only: true
    tmpfs:
      # Holds the multipart spool + a working copy of inputs up to the backend's
      # 500 MiB cap (≈2× the file). tmpfs pages count toward mem_limit.
      - /tmp:noexec,nosuid,size=1100m
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,sys,urllib.request as u; c=ssl.create_default_context(cafile='/run/secrets/tls_ca_crt'); sys.exit(0 if u.urlopen('https://analysis-worker:8001/health', timeout=4, context=c).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── PostgreSQL: primary database ─────────────────────────────────────────
  postgres:
    <<: *hardened
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: fenrir-v2-postgres
    restart: unless-stopped
    # Non-root from the start (the data dir is already 70-owned, so the entrypoint
    # needs no chown and no capabilities). Only the socket dir + /tmp are writable.
    user: "70:70"
    read_only: true
    tmpfs:
      - /var/run/postgresql:nosuid,size=1m
      - /tmp:noexec,nosuid,size=64m
    shm_size: 256m
    mem_limit: 1g
    pids_limit: 256
    secrets:
      - postgres_password          # bootstrap superuser (initdb only)
      - pg_migrator_password       # role passwords, applied by 10-fenrir-roles.sh
      - pg_app_password
      - pg_monitor_password
      - pg_backup_password
      - tls_postgres_crt
      - tls_postgres_key
    # Postgres refuses a key file readable by others, and compose secrets keep host
    # modes — so the key is copied to the tmpfs socket dir at 0600 on every start.
    entrypoint: ["/bin/sh", "-c", "install -m 0600 /run/secrets/tls_postgres_key /var/run/postgresql/server.key && exec docker-entrypoint.sh \"$$@\"", "--"]
    # pg_hba: service roles only, TLS 1.3 + SCRAM, data-tier network only; superuser =
    # local socket only. Connections, disconnections and all DDL are logged.
    command: >
      postgres -c hba_file=/etc/postgresql/pg_hba.conf
               -c password_encryption=scram-sha-256
               -c ssl=on -c ssl_min_protocol_version=TLSv1.3
               -c ssl_cert_file=/run/secrets/tls_postgres_crt
               -c ssl_key_file=/var/run/postgresql/server.key
               -c log_connections=on -c log_disconnections=on -c log_statement=ddl
    environment:
      POSTGRES_DB: fenrir
      POSTGRES_USER: fenrir
      # Read only by initdb on an EMPTY data dir; to rotate later, ALTER ROLE.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/postgres/10-fenrir-roles.sh:/docker-entrypoint-initdb.d/10-fenrir-roles.sh:ro
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      - fenrir-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fenrir -d fenrir"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis: sessions & cache ───────────────────────────────────────────────
  # NOTE: Redis data loss is acceptable. Redis holds only sessions, rate-limit
  # counters, and caches — all of which are ephemeral by design. Sessions expire
  # naturally; caches rebuild on next request. No Redis backup is needed.
  redis:
    <<: *hardened
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499   # supported to 2029-12; pinned minor (was floating 7)
    container_name: fenrir-v2-redis
    restart: unless-stopped
    user: "999:1000"          # the image's redis uid:gid — entrypoint skips chown/gosu
    read_only: true
    mem_limit: 384m           # maxmemory 256mb + overhead
    pids_limit: 64
    # ACL file instead of --requirepass (which would put the password in argv): the
    # default user is disabled; `fenrir` may run only the commands/keys FENRIR uses.
    secrets:
      - redis_acl
      - tls_ca_crt
      - tls_redis_crt
      - tls_redis_key
    # RDB snapshots (every 60 s if anything changed), not AOF: Redis 7 logs each
    # rate-limit Lua call to the AOF as a MULTI/EXEC block, and replaying those under
    # the ACL fails with NOPERM on every restart. Data here is ephemeral by design.
    # TLS 1.3 only (plaintext port disabled) with mutual TLS: clients must present an
    # internal-CA certificate AND authenticate as an ACL user.
    command: >
      redis-server --aclfile /run/secrets/redis_acl --appendonly no --save "60 1"
                   --maxmemory 256mb --maxmemory-policy allkeys-lru
                   --port 0 --tls-port 6379 --tls-protocols TLSv1.3 --tls-auth-clients yes
                   --tls-cert-file /run/secrets/tls_redis_crt --tls-key-file /run/secrets/tls_redis_key
                   --tls-ca-cert-file /run/secrets/tls_ca_crt
    volumes:
      - redis-data:/data
    networks:
      - fenrir-data
    healthcheck:
      # ACL user `healthcheck` may only PING (nopass). redis-cli exits 0 even on an
      # error reply, so require the literal PONG.
      test: ["CMD-SHELL", "redis-cli --tls --sni redis --cacert /run/secrets/tls_ca_crt --cert /run/secrets/tls_redis_crt --key /run/secrets/tls_redis_key --no-auth-warning --user healthcheck --pass x ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backup: daily pg_dump ─────────────────────────────────────────────────
  backup:
    <<: *hardened
    build:
      context: ./docker/backup     # postgres:16-alpine (digest-pinned) + age + baked-in scripts
      dockerfile: Dockerfile
    container_name: fenrir-v2-backup
    restart: unless-stopped
    # Root only for the one-time /backups ownership fix in scheduler.sh — which needs
    # exactly CHOWN (chown) and FSETID (keep setgid through chmod). Nothing else.
    cap_add:
      - CHOWN
      - FSETID
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    mem_limit: 512m
    pids_limit: 64
    secrets:
      - source: pg_backup_password   # read-only role (pg_read_all_data) → private .pgpass
        target: postgres_password
      - tls_ca_crt
    volumes:
      - backup-data:/backups
      - evidence-data:/evidence:ro          # ISO/IEC 27037 §6.9.2 — mirror evidence (read-only)
    environment:
      # age PUBLIC key; dumps are encrypted to it (the identity stays offline).
      - BACKUP_AGE_RECIPIENT=${BACKUP_AGE_RECIPIENT:-}
      - PGUSER=fenrir_backup
      - PGSSLMODE=verify-full                 # TLS 1.3 to Postgres, server cert verified
      - PGSSLROOTCERT=/run/secrets/tls_ca_crt
    networks:
      - fenrir-data
    depends_on:
      postgres:
        condition: service_healthy
    # scheduler.sh fixes the shared /backups perms (only when wrong) so the non-root
    # backend (uid 1001) can write manual backups while the sticky bit keeps each
    # side from deleting the other's files, then checks hourly and runs backup.sh
    # whenever the last success is >23 h old — a restart can never skip a day.
    # (Entrypoint: scheduler.sh, baked into the image.)
    healthcheck:
      # Unhealthy when the last SUCCESSFUL dump is older than 26 h (1560 min).
      test: ["CMD-SHELL", "test -n \"$$(find /backups/.last_success -mmin -1560 2>/dev/null)\""]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 5m

  # ── Audit-chain tamper monitor (GS-8) ────────────────────────────────────
  # Reuses the backend image. Every ANCHOR_INTERVAL it verifies the audit-chain
  # segment since the last anchor, RFC-3161 timestamps the chain head (best-effort,
  # only if TSA_URL set), and records an AuditAnchor. Runs first, then sleeps — so
  # anchoring starts immediately. See docs/coc-gs8-tamper-monitoring-slice.md.
  audit-monitor:
    <<: *hardened
    image: dfir-fenrir-v2-backend:local   # the backend's own build — never a separate one
    pull_policy: never                    # never resolve this name against Docker Hub
    container_name: fenrir-v2-audit-monitor
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m       # the .anchor_ok health marker
    mem_limit: 256m
    pids_limit: 64
    secrets:
      - source: pg_monitor_password  # reads audit_logs, writes audit_anchor — nothing else
        target: postgres_password
      - tls_ca_crt
    environment:
      - PGHOST=postgres
      - PGUSER=fenrir_monitor
      - PGDATABASE=fenrir
      - DB_SSL_CA=/run/secrets/tls_ca_crt
      - TSA_URL=${TSA_URL:-}
      - ANCHOR_INTERVAL=${ANCHOR_INTERVAL:-3600}
    networks:
      # Data tier only — no egress. If you set TSA_URL (RFC 3161 timestamps), also
      # attach fenrir-internal so the monitor can reach the TSA.
      - fenrir-data
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    # A run that fails chain verification exits non-zero → no marker → unhealthy.
    entrypoint: ["/bin/sh", "-c", "while true; do if python -m audit_monitor; then date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/.anchor_ok; fi; sleep \"${ANCHOR_INTERVAL:-3600}\"; done"]
    healthcheck:
      # Healthy while the last successful verify+anchor is younger than 2 intervals + 10 min.
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/.anchor_ok -mmin -$$(( $${ANCHOR_INTERVAL:-3600} / 30 + 10 )) 2>/dev/null)\""]
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 60s
