# DFIR-FENRIR v2 — Postgres client authentication (mounted read-only; see compose).
# First match wins.
# TYPE  DATABASE  USER                                                     ADDRESS  METHOD
#
# Local socket: reachable only via `docker exec` into this container (already
# root-equivalent on the host) — healthcheck, break-glass, restore, role script.
local   all       all                                                               trust
# The bootstrap superuser never authenticates over the network.
host    all       fenrir                                                   all      reject
# Plaintext network connections are refused outright — TLS (1.3, server-enforced) only.
hostnossl all     all                                                      all      reject
# Service roles: only the fenrir database, only from the data-tier network, TLS + SCRAM.
hostssl fenrir    fenrir_app,fenrir_migrator,fenrir_monitor,fenrir_backup  samenet  scram-sha-256
# Everything else is refused.
host    all       all                                                      all      reject
